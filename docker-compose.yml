version: '3.8'

services:
  app:
    # Image is built and pushed to GHCR by .github/workflows/cd.yml.
    # IMAGE_TAG can be set in Dokploy → Environment to pin a specific build
    # (e.g. sha-1a2b3c4); defaults to the latest master build.
    image: ghcr.io/nn80nn/wordwaverisebackend:${IMAGE_TAG:-latest}
    pull_policy: always
    # To build from source locally instead, comment out the two lines above
    # and uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: wordwaverise-backend
    restart: unless-stopped
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DRIVER=org.postgresql.Driver
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_REALM=${JWT_REALM}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
      - APP_ENV=production
      - AI_DOMEN=${AI_DOMEN}
      - AI_API=${AI_API}
      - AI_MODEL=${AI_MODEL}
      - AI_MODEL_FAST=${AI_MODEL_FAST}
      - AI_TOKEN_PARAM=${AI_TOKEN_PARAM}
      - AI_SUPPORTS_TEMPERATURE=${AI_SUPPORTS_TEMPERATURE}
      - AI_STRUCTURED_MODE=${AI_STRUCTURED_MODE}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - ACCOUNT_DELETION_GRACE_DAYS=${ACCOUNT_DELETION_GRACE_DAYS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ADMIN_SECRET=${ADMIN_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wordwaverise-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: wordwaverise-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wordwaverise-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  wordwaverise-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
