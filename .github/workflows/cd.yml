name: CD

on:
  push:
    branches: [ master ]
  workflow_dispatch:  # Allows manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: test-results
        path: build/test-results/
        retention-days: 7

    - name: Upload build reports
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: build-reports
        path: build/reports/
        retention-days: 7

  publish:
    name: Publish image to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=sha-

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Trigger Dokploy deploy
    needs: publish
    runs-on: ubuntu-latest

    steps:
    - name: Call Dokploy deploy webhook
      env:
        WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
      run: |
        if [ -z "$WEBHOOK_URL" ]; then
          echo "::warning::DOKPLOY_WEBHOOK_URL secret is not set — skipping deploy trigger"
          exit 0
        fi
        # Dokploy parses this as a git provider push event: without the
        # x-github-event header it cannot read the branch and answers
        # "Branch Not Match" (a 3xx, which curl --fail would not catch),
        # so check the status code and body explicitly.
        response=$(curl --silent --show-error --write-out '\n%{http_code}' \
          -X POST "$WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -H 'x-github-event: push' \
          -H 'x-github-delivery: ${{ github.run_id }}-${{ github.run_attempt }}' \
          -d '{"ref":"${{ github.ref }}","after":"${{ github.sha }}","repository":{"full_name":"${{ github.repository }}","default_branch":"master"}}')
        code=$(printf '%s' "$response" | tail -n1)
        body=$(printf '%s' "$response" | sed '$d')
        echo "Dokploy responded HTTP $code: $body"
        if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
          echo "::error::Dokploy rejected the deploy request (HTTP $code)"
          exit 1
        fi
        if printf '%s' "$body" | grep -qi "not match\|error\|unauthor"; then
          echo "::error::Dokploy did not start a deploy: $body"
          exit 1
        fi
        echo "Deploy triggered for ${{ github.sha }}"
